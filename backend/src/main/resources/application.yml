server:
  port: ${SERVER_PORT:8080}
  servlet:
    session:
      timeout: 2h
      cookie:
        http-only: true
        secure: ${app.auth.secure-cookie:false}
        same-site: lax
      tracking-modes: cookie

spring:
  mail:
    host: ${MAIL_HOST:}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true
      mail.smtp.connectiontimeout: 5000
      mail.smtp.timeout: 5000
      mail.smtp.writetimeout: 5000
  application:
    name: czspig-product-critic
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: ${MYSQL_URL:jdbc:mysql://localhost:3306/czspig_product_critic?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true}
    username: ${MYSQL_USERNAME:root}
    password: ${MYSQL_PASSWORD:}
  jackson:
    time-zone: Asia/Shanghai
    date-format: yyyy-MM-dd HH:mm:ss

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true

app:
  auth:
    secure-cookie: ${APP_AUTH_SECURE_COOKIE:false}
    anonymous-quota: ${APP_ANONYMOUS_QUOTA:3}
    daily-review-limit: ${APP_DAILY_REVIEW_LIMIT:200}
  mail:
    mode: ${APP_MAIL_MODE:smtp}
    public-origin: ${APP_PUBLIC_ORIGIN:https://localhost}
    from: ${MAIL_FROM:}
  anonymous-session-id: ${APP_ANONYMOUS_SESSION_ID:anonymous-dev-session}
  ai:
    provider: ${APP_AI_PROVIDER:auto}
    fallback-to-mock: ${APP_AI_FALLBACK_TO_MOCK:false}

deepseek:
  api-key: ${DEEPSEEK_API_KEY:}
  base-url: ${DEEPSEEK_BASE_URL:https://api.deepseek.com}
  model: ${DEEPSEEK_MODEL:deepseek-v4-flash}
  timeout-seconds: ${DEEPSEEK_TIMEOUT_SECONDS:60}
  max-tokens: ${DEEPSEEK_MAX_TOKENS:3000}
  temperature: ${DEEPSEEK_TEMPERATURE:0.6}
